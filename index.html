<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Carta · Pizza José Villegas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fbfaf8;
    --ink: #16130f;
    --ink-2: #6f675e;
    --grey: #a8a29b;
    --grey-line: #c9c3bb;
    --line: #e7e3dd;
    --line-soft: #f1ede7;
    --faint: #8a827a;
    --faint-2: #b0a79c;
    --note-bg: #f4f1eb;
    --ease: cubic-bezier(.32, .72, 0, 1);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: Archivo, system-ui, sans-serif; }
  a { color: oklch(0.60 0.17 38); text-decoration: none; }
  a:hover { color: oklch(0.50 0.17 38); }

  /* ---------- scroller ---------- */
  #scroll {
    position: relative; height: 100dvh; overflow-y: auto; overflow-x: hidden;
    scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #scroll::-webkit-scrollbar { display: none; }

  /* ---------- 1. portada ---------- */
  .hero {
    position: relative; height: 100dvh; scroll-snap-align: start; overflow: hidden;
    display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center;
  }
  .hero-bg { position: absolute; inset: 0; opacity: .14; filter: grayscale(.3); }
  .hero-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-veil {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(251,250,248,.35) 0%, rgba(251,250,248,0) 45%, rgba(251,250,248,.75) 100%);
  }
  .hero-kicker {
    align-self: end; padding-bottom: 8px; position: relative; z-index: 2;
    font: 500 11px/1 var(--mono); letter-spacing: .34em; text-transform: uppercase; color: var(--faint);
  }
  .hero-logo { position: relative; z-index: 2; width: min(80vw, 330px); aspect-ratio: 16 / 9; }
  .hero-logo img, .bar-logo img {
    display: block; width: 100%; height: 100%; object-fit: contain;
    mix-blend-mode: multiply; /* el PNG del logo no tiene alfa */
  }
  .hero-cta {
    position: relative; z-index: 2; align-self: start; padding-top: 54px;
    display: flex; flex-direction: column; align-items: center; gap: 26px;
  }
  .hero-cta p { margin: 0; font: 400 22px/1.25 Archivo, sans-serif; text-align: center; max-width: 220px; text-wrap: balance; }
  .arrow { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge {
    0%, 100% { transform: translateY(6px); opacity: .55 }
    50% { transform: translateY(-6px); opacity: 1 }
  }

  /* ---------- 2. categorías ---------- */
  #cats { position: relative; }
  .stage { position: sticky; top: 0; height: 100dvh; overflow: hidden; background: var(--paper); }
  .bar {
    position: absolute; inset: 0 0 auto 0; height: 92px; z-index: 6; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .bar-inner {
    opacity: 0; transform: translateY(-12px);
    transition: opacity .45s linear, transform .45s var(--ease);
  }
  .bar.is-on .bar-inner { opacity: 1; transform: none; }
  .bar-logo { width: 104px; height: 56px; }

  .bands { position: absolute; inset: 92px 0 0 0; }
  .band {
    position: absolute; inset: 0; cursor: pointer; z-index: 1;
    background: var(--paper);
    border-top: 1px solid var(--grey-line); border-bottom: 1px solid var(--grey-line);
    transition: clip-path .62s var(--ease), background .5s linear, border-color .5s linear;
  }
  .band.is-on { z-index: 2; background: var(--band-tint); border-color: var(--band-accent); }

  .photo {
    position: absolute; z-index: 3; pointer-events: none;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    filter: grayscale(1) opacity(.5);
    transition: top .62s var(--ease), width .62s var(--ease), height .62s var(--ease), filter .5s linear;
  }
  .photo.is-on { z-index: 5; filter: none; }

  .name, .more {
    position: absolute; z-index: 4; pointer-events: none; white-space: nowrap; color: var(--grey);
  }
  .name {
    font: 400 15px/1 'Archivo Black', Archivo, sans-serif; letter-spacing: .12em;
    transition: top .62s var(--ease), font-size .5s var(--ease), color .5s linear, letter-spacing .5s linear;
  }
  .name.is-on { font-size: 27px; letter-spacing: .05em; color: var(--band-accent); }
  .more {
    font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; opacity: 0;
    transition: top .62s var(--ease), opacity .4s linear, color .5s linear;
  }
  .more.is-on { opacity: 1; color: var(--band-accent); }
  .side-l { left: 7% }
  .side-r { right: 5% }

  .snaps { margin-top: -100dvh; pointer-events: none; }
  .snaps > div { height: 100dvh; scroll-snap-align: start; }

  /* ---------- 3. ficha de categoría ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 40; background: var(--paper);
    overflow-y: auto; overscroll-behavior: contain;
    transform: translateY(100%); visibility: hidden;
    transition: transform .5s var(--ease), visibility .5s linear;
  }
  .sheet.is-open { transform: none; visibility: visible; }
  .sheet-bar {
    position: sticky; top: 0; z-index: 3; background: var(--paper); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 18px 20px 16px;
  }
  .sheet-back {
    width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0;
    border: 1px solid #ddd8d1; border-radius: 999px; background: #fff;
    font-size: 19px; line-height: 1; color: var(--ink); cursor: pointer;
  }
  .sheet-title { font: 400 20px/1 'Archivo Black', Archivo, sans-serif; letter-spacing: .03em; }
  .sheet-body { padding: 4px 20px 64px; }

  .intro {
    border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; margin: 14px 0 4px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .row { display: flex; align-items: baseline; gap: 10px; }
  .row .lead { flex: 1; border-bottom: 1px dotted #d8d2ca; transform: translateY(-3px); }
  .intro .label { font: 500 10.5px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .intro .price { font: 600 13px/1.3 Archivo, sans-serif; }

  .group-title {
    font: 400 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; padding: 22px 0 6px;
  }
  .dish {
    display: grid; grid-template-columns: 1fr auto; gap: 14px;
    padding: 13px 0; border-bottom: 1px solid var(--line-soft);
  }
  .dish-main { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .dish-name { font: 400 14.5px/1.15 'Archivo Black', Archivo, sans-serif; letter-spacing: -.005em; }
  .dish-ing { font: 400 12.5px/1.45 Archivo, sans-serif; color: var(--ink-2); text-wrap: pretty; }
  .dish-price { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; white-space: nowrap; }
  .dish-price b { font: 600 15px/1.2 Archivo, sans-serif; }
  .dish-price span { font: 500 10px/1.2 var(--mono); letter-spacing: .04em; color: var(--faint); }
  .group-note { padding: 11px 0 2px; font: 500 10.5px/1.4 var(--mono); letter-spacing: .06em; color: var(--faint); }
  .footnote {
    margin-top: 18px; padding: 12px 14px; border-radius: 8px; background: var(--note-bg);
    font: 500 11px/1.45 var(--mono); letter-spacing: .05em; color: var(--ink-2);
  }
  .disclaimer { padding-top: 22px; font: 400 10.5px/1.5 var(--mono); color: var(--faint-2); text-align: center; }
</style>
</head>
<body>

<div id="scroll">
  <section class="hero">
    <div class="hero-bg"><!-- pendiente: foto del local
      <img src="assets/local.jpg" alt="" /> --></div>
    <div class="hero-veil"></div>
    <div class="hero-kicker">Calzone · Pizzas · Roscas</div>
    <div class="hero-logo"><img src="assets/logo.png" alt="Pizza José Villegas" /></div>
    <div class="hero-cta">
      <p>Descubre nuestra carta</p>
      <svg class="arrow" width="26" height="74" viewBox="0 0 26 74" fill="none" aria-hidden="true">
        <path d="M13 74 L13 4" stroke="#16130f" stroke-width="2" stroke-linecap="round" />
        <path d="M3 15 L13 3 L23 15" stroke="#16130f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </section>

  <div id="cats">
    <div class="stage">
      <div class="bar" id="bar">
        <div class="bar-inner"><div class="bar-logo"><img src="assets/logo.png" alt="Pizza José Villegas" /></div></div>
      </div>
      <div class="bands" id="bands"></div>
    </div>
    <div class="snaps" id="snaps"></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-bar">
    <button class="sheet-back" id="sheet-back" aria-label="Volver">←</button>
    <div class="sheet-title" id="sheet-title"></div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script>
/* ------------------------------------------------------------------
   DATOS DE LA CARTA — textos y precios literales del restaurante.
   items: [nombre, ingredientes, precio]
------------------------------------------------------------------ */
const CATS = [
  {
    name: 'PIZZAS', hue: 38, src: 'assets/pizza.png', w: 196, h: 218, side: 'left',
    intro: [['Base pizza individual', '1,20€/ud.'], ['Pack pizzas familiares', '7,00€/5 uds.']],
    footnote: '0,50€ por ingrediente extra',
    groups: [

      { title: 'Pizzas especiales', alt: 'Individual 6€', note: '* Individuales 6€', items: [
        ['HAWAIANA', 'TOMATE, MOZZARELLA, BACON, PIÑA Y ORÉGANO', '8,50€'],
        ['NEW YORK', 'TOMATE, MOZZARELLA, YORK, BACON', '8,50€'],
        ['FUSIÓN', 'TOMATE, MOZZARELLA, BACON, ATÚN, ORÉGANO', '8,50€'],
        ['MEDITERRANEA', 'TOMATE, MOZZARELLA, ATÚN, YORK Y ORÉGANO', '8,50€'],
        ['FRANKFURT', 'TOMATE, MOZZARELLA, BACON, SALCHICHAS, ORÉGANO', '8,50€'],
        ['PHILADELPHIA', 'PHILADELPHIA, MOZARELLA, BACON, POLLO, ORÉGANO', '8,50€'],
        ['CARBONARA', 'NATA, MOZZARELLA, BACON, CEBOLLA, POLLO, ORÉGANO', '8,50€'],
        ['BIANCA', 'NATA, MOZARELLA, BACON, CHAMPIÑÓN, ORÉGANO', '8,50€'],
        ['GAUCHA', 'TOMATE, MOZZARELLA, POLLO, BACON, SALSA GAUCHA, OREGANO', '8,50€'],
        ['BBQ', 'TOMATE, MOZZARELLA, BACON, CARNE PICADA O POLLO, SALSA BBO, OREGANO', '8,50€']
      ]},
      { title: 'Pizzas gourmet', items: [
        ['DELICIOSA', 'NATA, MOZZARELLA, BACON, POLLO, QUESO AZUL y ORÉGANO', '9€'],
        ['CREMOSITA', 'PHILADELPHIA, MOZZARELLA, BACON, POLLO, CEBOLLA CARAMELIZADA', '9€'],
        ['5 QUESOS', 'TOMATE, MOZZARELLA, QUESO RULO DE CABRA, QUEDAR, AZUL Y QUESO CURADO', '9€'],
        ['KEBAB', 'KÉTCHUP, MOZZARELLA, CARNE KEBAB POLLO, SALSA KEBAB', '9€'],
        ['Pizza Caramelizada', 'tomate, mozzarella, bacon, queso de cabra y cebolla caramelizada', '10€'],
        ['Pizza Pulled pork', 'tomate, mozzarella, pulled pork, queso de cabra y salsa bbq', '11,50€'],
        ['Pizza Nórdica', 'queso Filadelfia, mozzarella, salmón, gambas y orégano', '10€'],
        ['CHAPARRA', 'TOMATE, MOZZARELLA, ATÚN, BACON, JAMÓN SERRANO, YORK', '10€'],
        ['PULLED PORK', 'TOMATE, BACON, PULLED PORK, QUESO DE CABRA, SALSA BBQ', '11,50€'],
        ['SUPREMA', 'TOMATE, MOZZARELLA, BACON, CARNE PICADA, POLLO, QUESO CUARDO, CEBOLLA MORADA, SALSA BBQ, OREGANO', '11,50€'],
        ['BACON BURGER', 'TOMATE, MOZZARELLA, BACON, TOMATE NATURAL, MINI BURGER, CEBOLLA MORADA, QUESO CHEDDAR, SALSA BURGER, OREGANO', '11,50€'],
        ['Pizza mexicana', 'Salsa mexicana, mozzarella, queso cheddar, salsa picante o pollo, pimientos', '11,50€'],
        ['Pizza marinera', 'tomate, mozzarella, anchoas, atún, palitos de mar, mejillones y gambas', '11,50€']
      ]}
    ]
  },
  {
    name: 'BOCADILLOS XXL', hue: 145, src: 'assets/bocadillo.png', w: 268, h: 150, side: 'right',
    groups: [{ items: [
      ['Lomo adobado o magreta completa', 'tomate natural, lechuga, lomo adobado o magreta y queso', '5,50€'],
      ['Lomo', 'tomate natural, lechuga, bacon, lomo y queso', '6,50€'],
      ['Burger', 'tomate natural, salsa burger, bacon, cebolla morada, mini burger y queso cheddar', '7,50€'],
      ['Big burger', 'Tomate natural, lechuga, carne de pollo, jamón York, tortilla francesa y queso', '8,00€'],
      ['POLLO', 'TOMATE NATURAL, LECHUGA, POLLO, QUESO', '6€'],
      ['CAMPERO DE POLLO', 'TOMATE NATURAL, POLLO, TORTILLA FRANCESA, QUESO', '7€'],
      ['CAMPERO', 'TOMATE NATURAL, JAMÓN YORK, QUESO, LECHUGA', '5€'],
      ['SERRANITO', 'TOMATE NATURAL, POLLO O LOMO, PIMIENTO VERDE, JAMÓN SERRANO, QUESO', '7,50€'],
      ['GOURMET', 'QUESO PHILADELPHIA, POLLO, BACON, CEBOLLA CARAMELIZADA, QUESO', '7,50€']
    ]}]
  },
  {
    name: 'ROSCAS', hue: 78, src: 'assets/rosca.png', w: 194, h: 194, side: 'left',
    groups: [{ items: [
      ['LOMO AL CURRY', 'TOMATE NATURAL, LOMO, CEBOLLA FRITA, SALSA CURRY, QUESO', '8€'],
      ['GAUCHO', 'TOMATE NATURAL, SALSA GAUCHA, POLLO, QUESO', '8€'],
      ['SERRANITO', 'TOMATE NATURAL, POLLO O LOMO, PIMIENTO VERDE, JAMÓN SERRANO, QUESO', '10€'],
      ['BRUTA', 'TOMATE NATURAL, POLLO, TORTILLA FRANCESA, JAMÓN SERRANO, QUESO', '12€'],
      ['LOMITO', 'TOMATE NATURAL, LOMO, TORTILLA PATATAS, PIMIENTOS VERDES, QUESO', '12€'],
      ['BURGER', 'TOMATE NATURAL, SALSA BURGER, BACON, MINI BURGER, QUESO CHEDDAR', '10€']
    ]}]
  },
  {
    name: 'PANINIS XXL', hue: 300, src: 'assets/panini.png', w: 248, h: 200, side: 'right',
    groups: [{ items: [
      ['ATÚN', 'TOMATE, MOZZARELLA, ATÚN', '5€'],
      ['YORK', 'TOMATE, MOZZARELLA, JAMÓN YORK', '5€'],
      ['ANDALUZA', 'TOMATE, MOZZARELLA, YORK, ATÚN, OLIVAS', '5€'],
      ['KEBAB', 'KÉTCHUP, SALSA KEBAB, CARNE KEBAB, MOZZARELLA', '6€'],
      ['BBQ', 'TOMATE, MOZZARELLA, CARNE PICADA, SALCHICHAS, SALSA BBQ', '6€']
    ]}]
  },
  {
    name: 'CALZONES', hue: 195, src: 'assets/calzone.png', w: 218, h: 176, side: 'left',
    footnote: 'Calzone XXL: +1,50€ por unidad',
    groups: [{ items: [
      ['Carbonara', 'nata, mozzarella, bacon, pollo y huevo', '6,50€'],
      ['Pollo cheddar', 'tomate, mozzarella, bacon, pollo y cheddar', '6,50€'],
      ['Mexicana', 'tomate, mozzarella, carne picada, pimientos variados y salsa', '6,50€'],
      ['Kebab', 'Ketchup, mozzarella, carne kebab, salsa kebab y orégano', '6,50€'],
      ['Burger', 'tomate, mozzarella, salsa, bacon, cebolla morada, mini burger, queso cheddar', '7,50€'],
      ['Al gusto', 'Tomate, mozzarella + 3 ingredientes', '']
    ]}]
  }
];

/* Reparto de altura y inclinación de las fronteras (ver README) */
const ACTIVE_SHARE = 0.40;
const TILT = 9;
const TILTS = [TILT, TILT * 1.2, -TILT, TILT * 0.85, -TILT * 0.9, TILT * 0.6];

const scroller = document.getElementById('scroll');
const bandsEl = document.getElementById('bands');
const snapsEl = document.getElementById('snaps');
const barEl = document.getElementById('bar');
const sheet = document.getElementById('sheet');
const sheetTitle = document.getElementById('sheet-title');
const sheetBody = document.getElementById('sheet-body');

const count = c => c.groups.reduce((n, g) => n + g.items.length, 0);
const accent = hue => `oklch(0.56 0.16 ${hue})`;
const tint = hue => `oklch(0.97 0.022 ${hue})`;

let active = 0;
const parts = CATS.map((c, i) => {
  const sideClass = c.side === 'left' ? 'side-l' : 'side-r';

  const band = document.createElement('div');
  band.className = 'band';
  band.style.setProperty('--band-accent', accent(c.hue));
  band.style.setProperty('--band-tint', tint(c.hue));
  band.addEventListener('click', () => openSheet(i));

  const photo = document.createElement('div');
  photo.className = `photo ${sideClass}`;
  photo.style.backgroundImage = `url(${c.src})`;
  photo.setAttribute('role', 'img');
  photo.setAttribute('aria-label', c.name);

  const name = document.createElement('div');
  name.className = `name ${sideClass}`;
  name.style.setProperty('--band-accent', accent(c.hue));
  name.textContent = c.name;

  const more = document.createElement('div');
  more.className = `more ${sideClass}`;
  more.style.setProperty('--band-accent', accent(c.hue));
  more.textContent = `Ver los ${count(c)} platos →`;

  bandsEl.append(band, photo, name, more);
  snapsEl.append(document.createElement('div'));
  return { band, photo, name, more };
});

function layout() {
  const n = CATS.length;
  const rest = (1 - ACTIVE_SHARE) / (n - 1);
  const cum = [0];
  for (let i = 0; i < n; i++) cum.push(cum[i] + (i === active ? ACTIVE_SHARE : rest));
  const base = cum.map(c => 8 + c * 84);
  const L = base.map((b, i) => b - (TILTS[i] || 0) / 2);
  const R = base.map((b, i) => b + (TILTS[i] || 0) / 2);

  CATS.forEach((c, i) => {
    const on = i === active;
    const p = parts[i];
    const topEdge = (L[i] + R[i]) / 2;

    p.band.style.clipPath =
      `polygon(0% ${L[i]}%, 100% ${R[i]}%, 100% ${R[i + 1]}%, 0% ${L[i + 1]}%)`;
    p.band.classList.toggle('is-on', on);

    p.photo.classList.toggle('is-on', on);
    p.photo.style.top = `calc(${topEdge}% + ${on ? 74 : 28}px)`;
    p.photo.style.width = (on ? c.w : Math.round(c.w * 0.3)) + 'px';
    p.photo.style.height = (on ? c.h : Math.round(c.h * 0.3)) + 'px';

    p.name.classList.toggle('is-on', on);
    p.name.style.top = `calc(${topEdge}% + 11px)`;
    p.more.classList.toggle('is-on', on);
    p.more.style.top = `calc(${topEdge}% + 47px)`;
  });
}

scroller.addEventListener('scroll', () => {
  const h = scroller.clientHeight || 1;
  const i = Math.max(0, Math.min(CATS.length - 1, Math.round((scroller.scrollTop - h) / h)));
  barEl.classList.toggle('is-on', scroller.scrollTop > h * 0.35);
  if (i !== active) { active = i; layout(); }
}, { passive: true });

window.addEventListener('resize', layout);
layout();

/* ---------- ficha de categoría ---------- */
function openSheet(i) {
  const c = CATS[i];
  sheetTitle.textContent = c.name;
  sheetTitle.style.color = accent(c.hue);
  sheetBody.replaceChildren();

  if (c.intro) {
    const box = document.createElement('div');
    box.className = 'intro';
    c.intro.forEach(([label, price]) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<div class="label"></div><div class="lead"></div><div class="price"></div>`;
      row.querySelector('.label').textContent = label;
      row.querySelector('.price').textContent = price;
      box.append(row);
    });
    sheetBody.append(box);
  }

  c.groups.forEach(g => {
    if (g.title) {
      const t = document.createElement('div');
      t.className = 'group-title';
      t.style.color = accent(c.hue);
      t.textContent = g.title;
      sheetBody.append(t);
    }
    g.items.forEach(([name, ing, price]) => {
      const row = document.createElement('div');
      row.className = 'dish';
      row.innerHTML =
        `<div class="dish-main"><div class="dish-name"></div><div class="dish-ing"></div></div>` +
        `<div class="dish-price"><b></b></div>`;
      row.querySelector('.dish-name').textContent = name;
      row.querySelector('.dish-ing').textContent = ing;
      row.querySelector('b').textContent = price || '—';
      if (g.alt && price) {
        const alt = document.createElement('span');
        alt.textContent = g.alt;
        row.querySelector('.dish-price').append(alt);
      }
      sheetBody.append(row);
    });
    if (g.note) {
      const nt = document.createElement('div');
      nt.className = 'group-note';
      nt.textContent = g.note;
      sheetBody.append(nt);
    }
  });

  if (c.footnote) {
    const fn = document.createElement('div');
    fn.className = 'footnote';
    fn.textContent = c.footnote;
    sheetBody.append(fn);
  }

  const dis = document.createElement('div');
  dis.className = 'disclaimer';
  dis.textContent = 'Consulta al personal sobre alérgenos e intolerancias';
  sheetBody.append(dis);

  sheet.classList.add('is-open');
  sheet.scrollTop = 0;
}

document.getElementById('sheet-back')
  .addEventListener('click', () => sheet.classList.remove('is-open'));
</script>
</body>
</html>
